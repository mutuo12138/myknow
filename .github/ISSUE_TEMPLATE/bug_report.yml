name: Bug report
description: 报告可复现的问题
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的步骤，不要上传真实素材或密钥。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 请填写 Git commit、发行版标签或本地构建版本。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 请填写 Windows 版本、Python/Node 版本，以及是否使用浏览器扩展。
      placeholder: |
        Windows: 11 24H2
        Python: 3.11.x
        Node: 20.x
        Browser: Chrome 版本 / 未使用
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可粘贴脱敏后的错误日志或截图；请勿上传真实素材、数据库或密钥。
